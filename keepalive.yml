# Supabase тегін жобасы 7 күн қолданылмаса «ұйықтап» қалады.
# Бұл автоматты тапсырма 3 күнде бір рет дерекқорға шағын сұрау жібереді.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' assets/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' assets/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{}'
